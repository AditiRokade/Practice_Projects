version: 2

models:
  - name: stg_telecom_events
    description: Typed and normalized synthetic network events.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: subscriber_id
        data_tests: [not_null]
      - name: event_ts
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]

  - name: int_subscriber_daily
    description: Subscriber-day aggregates used to derive alert features.
    columns:
      - name: subscriber_id
        data_tests: [not_null]
      - name: event_date
        data_tests: [not_null]
      - name: event_count
        data_tests: [not_null]

  - name: fct_risk_alerts
    description: Explainable demo risk categories; not a production fraud model.
    columns:
      - name: subscriber_id
        data_tests: [not_null]
      - name: event_date
        data_tests: [not_null]
      - name: risk_level
        data_tests:
          - accepted_values:
              arguments:
                values: ['LOW', 'MEDIUM', 'HIGH']
